name: Netlify MCP
on:
  push:
    paths: ['netlify-mcp/**', 'netlify.toml', '.github/workflows/netlify-mcp.yml']
  pull_request:
    paths: ['netlify-mcp/**', 'netlify.toml', '.github/workflows/netlify-mcp.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ../scripts/gerar_icms_manual.mjs --check
        working-directory: netlify-mcp
      - run: node --test test/*.test.js
        working-directory: netlify-mcp
